<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Closed, Settled and Written-off compared</title><desc id="d">Three credit report statuses. Closed: loan repaid in full, the best outcome. Settled: lender accepted less than the full amount; negative for future credit. Written-off: lender removed the dues from its books but may still recover; the debt is not forgiven.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52606d"/></marker></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="#f7f9fc" stroke="none" stroke-width="2"/>
<text x="60" y="78" font-size="34" fill="#102a43" font-weight="700" text-anchor="start">What your credit report status means</text><text x="60" y="116" font-size="20" fill="#52606d" font-weight="400" text-anchor="start">How the three most common end statuses are usually read by lenders.</text><rect x="60" y="160" width="340" height="430" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="60" y="160" width="340" height="12" rx="6" fill="#00875a" stroke="none" stroke-width="2"/><text x="90" y="230" font-size="32" fill="#102a43" font-weight="700" text-anchor="start">Closed</text><rect x="90" y="254" width="120" height="36" rx="18" fill="#e6f4ee" stroke="none" stroke-width="2"/><text x="150" y="279" font-size="17" fill="#00875a" font-weight="700" text-anchor="middle">Best</text><text x="90" y="340" font-size="20" fill="#102a43" font-weight="400" text-anchor="start">Loan repaid in full</text><text x="90" y="380" font-size="20" fill="#102a43" font-weight="400" text-anchor="start">as agreed.</text><text x="90" y="420" font-size="20" fill="#102a43" font-weight="400" text-anchor="start"></text><text x="90" y="460" font-size="20" fill="#102a43" font-weight="400" text-anchor="start">Seen as a positive</text><text x="90" y="500" font-size="20" fill="#102a43" font-weight="400" text-anchor="start">repayment record.</text><rect x="430" y="160" width="340" height="430" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="430" y="160" width="340" height="12" rx="6" fill="#c79a3a" stroke="none" stroke-width="2"/><text x="460" y="230" font-size="32" fill="#102a43" font-weight="700" text-anchor="start">Settled</text><rect x="460" y="254" width="120" height="36" rx="18" fill="#fbf3e1" stroke="none" stroke-width="2"/><text x="520" y="279" font-size="17" fill="#c79a3a" font-weight="700" text-anchor="middle">Negative</text><text x="460" y="340" font-size="20" fill="#102a43" font-weight="400" text-anchor="start">Lender accepted less</text><text x="460" y="380" font-size="20" fill="#102a43" font-weight="400" text-anchor="start">than the full amount</text><text x="460" y="420" font-size="20" fill="#102a43" font-weight="400" text-anchor="start">and closed the account.</text><text x="460" y="460" font-size="20" fill="#102a43" font-weight="400" text-anchor="start">Better than unpaid</text><text x="460" y="500" font-size="20" fill="#102a43" font-weight="400" text-anchor="start">default; worse than Closed.</text><rect x="800" y="160" width="340" height="430" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="800" y="160" width="340" height="12" rx="6" fill="#b42318" stroke="none" stroke-width="2"/><text x="830" y="230" font-size="32" fill="#102a43" font-weight="700" text-anchor="start">Written-off</text><rect x="830" y="254" width="120" height="36" rx="18" fill="#fdecea" stroke="none" stroke-width="2"/><text x="890" y="279" font-size="17" fill="#b42318" font-weight="700" text-anchor="middle">Serious</text><text x="830" y="340" font-size="20" fill="#102a43" font-weight="400" text-anchor="start">Lender removed the dues</text><text x="830" y="380" font-size="20" fill="#102a43" font-weight="400" text-anchor="start">from its books.</text><text x="830" y="420" font-size="20" fill="#102a43" font-weight="400" text-anchor="start">The debt is NOT forgiven;</text><text x="830" y="460" font-size="20" fill="#102a43" font-weight="400" text-anchor="start">recovery can continue.</text><text x="830" y="500" font-size="20" fill="#102a43" font-weight="400" text-anchor="start"></text><text x="600" y="635" font-size="17" fill="#52606d" font-weight="400" text-anchor="middle">Illustrative summary. Each lender and credit bureau applies its own policies.</text>
</svg>
