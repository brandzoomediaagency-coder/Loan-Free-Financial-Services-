<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">The six stages of a typical settlement case</title><desc id="d">A timeline: 1 free assessment, 2 documents and engagement, 3 strategy, 4 lender communication, 5 written offer checked, 6 payment, NOC and credit report check.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52606d"/></marker></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="#f7f9fc" stroke="none" stroke-width="2"/>
<text x="60" y="78" font-size="34" fill="#102a43" font-weight="700" text-anchor="start">Six stages of a typical case</text><text x="60" y="116" font-size="20" fill="#52606d" font-weight="400" text-anchor="start">Timings depend on your lender and on how quickly documents and funds are ready.</text><line x1="120" y1="270" x2="1080" y2="270" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/><circle cx="120" cy="270" r="34" fill="#00875a"/><text x="120" y="281" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="120" y="350" font-size="21" fill="#102a43" font-weight="700" text-anchor="middle">Assessment</text><text x="120" y="380" font-size="17" fill="#52606d" font-weight="400" text-anchor="middle">Free, confidential</text><text x="120" y="402.95" font-size="17" fill="#52606d" font-weight="400" text-anchor="middle">review of options</text><circle cx="312" cy="270" r="34" fill="#00875a"/><text x="312" y="281" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="312" y="350" font-size="21" fill="#102a43" font-weight="700" text-anchor="middle">Documents</text><text x="312" y="380" font-size="17" fill="#52606d" font-weight="400" text-anchor="middle">Statements, KYC,</text><text x="312" y="402.95" font-size="17" fill="#52606d" font-weight="400" text-anchor="middle">proof of hardship</text><circle cx="504" cy="270" r="34" fill="#00875a"/><text x="504" y="281" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="504" y="350" font-size="21" fill="#102a43" font-weight="700" text-anchor="middle">Strategy</text><text x="504" y="380" font-size="17" fill="#52606d" font-weight="400" text-anchor="middle">Settlement,</text><text x="504" y="402.95" font-size="17" fill="#52606d" font-weight="400" text-anchor="middle">restructuring or</text><text x="504" y="425.9" font-size="17" fill="#52606d" font-weight="400" text-anchor="middle">another route</text><circle cx="696" cy="270" r="34" fill="#00875a"/><text x="696" y="281" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><text x="696" y="350" font-size="21" fill="#102a43" font-weight="700" text-anchor="middle">Lender contact</text><text x="696" y="380" font-size="17" fill="#52606d" font-weight="400" text-anchor="middle">Written request</text><text x="696" y="402.95" font-size="17" fill="#52606d" font-weight="400" text-anchor="middle">to the lender</text><circle cx="888" cy="270" r="34" fill="#00875a"/><text x="888" y="281" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="888" y="350" font-size="21" fill="#102a43" font-weight="700" text-anchor="middle">Written offer</text><text x="888" y="380" font-size="17" fill="#52606d" font-weight="400" text-anchor="middle">Settlement letter</text><text x="888" y="402.95" font-size="17" fill="#52606d" font-weight="400" text-anchor="middle">checked before</text><text x="888" y="425.9" font-size="17" fill="#52606d" font-weight="400" text-anchor="middle">you pay</text><circle cx="1080" cy="270" r="34" fill="#c79a3a"/><text x="1080" y="281" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle">6</text><text x="1080" y="350" font-size="21" fill="#102a43" font-weight="700" text-anchor="middle">Closure</text><text x="1080" y="380" font-size="17" fill="#52606d" font-weight="400" text-anchor="middle">Payment, NOC,</text><text x="1080" y="402.95" font-size="17" fill="#52606d" font-weight="400" text-anchor="middle">credit report</text><text x="1080" y="425.9" font-size="17" fill="#52606d" font-weight="400" text-anchor="middle">check</text><rect x="60" y="520" width="1080" height="80" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="553" font-size="19" fill="#102a43" font-weight="600" text-anchor="middle">Never pay before you have a written settlement letter. Pay only into the lender’s official account.</text><text x="600" y="581" font-size="17" fill="#52606d" font-weight="400" text-anchor="middle">A settlement paid over more than three months is treated as a restructuring under the RBI framework.</text>
</svg>
