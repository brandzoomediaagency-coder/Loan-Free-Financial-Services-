<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Documents to collect when you settle a loan</title><desc id="d">Four documents in order: the written settlement letter before you pay; the payment receipt from the lender’s official account; the no-dues certificate or NOC after payment; and an updated credit report showing the account as closed or settled.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52606d"/></marker></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="#f7f9fc" stroke="none" stroke-width="2"/>
<text x="60" y="78" font-size="34" fill="#102a43" font-weight="700" text-anchor="start">Your settlement paperwork, in order</text><text x="60" y="116" font-size="20" fill="#52606d" font-weight="400" text-anchor="start">Keep copies of every document for at least a few years.</text><rect x="60" y="170" width="250" height="380" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><path d="M155 200 h46 l18 18 v62 h-64z" fill="#e6f4ee" stroke="#00875a" stroke-width="2.5"/><path d="M166 236 h40 M166 250 h40 M166 264 h28" stroke="#00875a" stroke-width="2.5"/><text x="185" y="330" font-size="21" fill="#102a43" font-weight="700" text-anchor="middle">Settlement letter</text><rect x="105" y="348" width="160" height="32" rx="16" fill="#fbf3e1" stroke="none" stroke-width="2"/><text x="185" y="370" font-size="16" fill="#8a6516" font-weight="700" text-anchor="middle">Before you pay</text><text x="185" y="420" font-size="18" fill="#52606d" font-weight="400" text-anchor="middle">Amount, deadline and</text><text x="185" y="444.3" font-size="18" fill="#52606d" font-weight="400" text-anchor="middle">that the account will</text><text x="185" y="468.6" font-size="18" fill="#52606d" font-weight="400" text-anchor="middle">be closed on payment</text><line x1="314" y1="360" x2="331" y2="360" stroke="#52606d" stroke-width="3" marker-end="url(#ah)"/><rect x="335" y="170" width="250" height="380" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><path d="M430 200 h46 l18 18 v62 h-64z" fill="#e6f4ee" stroke="#00875a" stroke-width="2.5"/><path d="M441 236 h40 M441 250 h40 M441 264 h28" stroke="#00875a" stroke-width="2.5"/><text x="460" y="330" font-size="21" fill="#102a43" font-weight="700" text-anchor="middle">Payment receipt</text><rect x="380" y="348" width="160" height="32" rx="16" fill="#fbf3e1" stroke="none" stroke-width="2"/><text x="460" y="370" font-size="16" fill="#8a6516" font-weight="700" text-anchor="middle">When you pay</text><text x="460" y="420" font-size="18" fill="#52606d" font-weight="400" text-anchor="middle">Paid only into the</text><text x="460" y="444.3" font-size="18" fill="#52606d" font-weight="400" text-anchor="middle">lender’s official</text><text x="460" y="468.6" font-size="18" fill="#52606d" font-weight="400" text-anchor="middle">account</text><line x1="589" y1="360" x2="606" y2="360" stroke="#52606d" stroke-width="3" marker-end="url(#ah)"/><rect x="610" y="170" width="250" height="380" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><path d="M705 200 h46 l18 18 v62 h-64z" fill="#e6f4ee" stroke="#00875a" stroke-width="2.5"/><path d="M716 236 h40 M716 250 h40 M716 264 h28" stroke="#00875a" stroke-width="2.5"/><text x="735" y="330" font-size="21" fill="#102a43" font-weight="700" text-anchor="middle">NOC / no-dues letter</text><rect x="655" y="348" width="160" height="32" rx="16" fill="#fbf3e1" stroke="none" stroke-width="2"/><text x="735" y="370" font-size="16" fill="#8a6516" font-weight="700" text-anchor="middle">After payment</text><text x="735" y="420" font-size="18" fill="#52606d" font-weight="400" text-anchor="middle">Confirms nothing more</text><text x="735" y="444.3" font-size="18" fill="#52606d" font-weight="400" text-anchor="middle">is owed on the</text><text x="735" y="468.6" font-size="18" fill="#52606d" font-weight="400" text-anchor="middle">account</text><line x1="864" y1="360" x2="881" y2="360" stroke="#52606d" stroke-width="3" marker-end="url(#ah)"/><rect x="885" y="170" width="250" height="380" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><path d="M980 200 h46 l18 18 v62 h-64z" fill="#e6f4ee" stroke="#00875a" stroke-width="2.5"/><path d="M991 236 h40 M991 250 h40 M991 264 h28" stroke="#00875a" stroke-width="2.5"/><text x="1010" y="330" font-size="21" fill="#102a43" font-weight="700" text-anchor="middle">Credit report</text><rect x="930" y="348" width="160" height="32" rx="16" fill="#fbf3e1" stroke="none" stroke-width="2"/><text x="1010" y="370" font-size="16" fill="#8a6516" font-weight="700" text-anchor="middle">A few weeks later</text><text x="1010" y="420" font-size="18" fill="#52606d" font-weight="400" text-anchor="middle">Check the account</text><text x="1010" y="444.3" font-size="18" fill="#52606d" font-weight="400" text-anchor="middle">shows the agreed</text><text x="1010" y="468.6" font-size="18" fill="#52606d" font-weight="400" text-anchor="middle">status and zero dues</text><text x="600" y="610" font-size="19" fill="#102a43" font-weight="600" text-anchor="middle">If anything in the letter is unclear, ask the lender to correct it in writing before you pay.</text>
</svg>
