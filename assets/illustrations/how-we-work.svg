<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">How Loan Free works with you and your lender</title><desc id="d">Three columns: you share your situation and decide; Loan Free assesses, prepares the request and checks documents; your lender decides and issues the settlement letter. Settlement money goes directly to the lender.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52606d"/></marker></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="#f7f9fc" stroke="none" stroke-width="2"/>
<text x="60" y="78" font-size="34" fill="#102a43" font-weight="700" text-anchor="start">Who does what in a settlement</text><text x="60" y="116" font-size="20" fill="#52606d" font-weight="400" text-anchor="start">You stay in control. Only your lender can agree terms.</text><rect x="60" y="170" width="320" height="400" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="60" y="170" width="320" height="70" rx="16" fill="#102a43" stroke="none" stroke-width="2"/><rect x="60" y="210" width="320" height="30" rx="0" fill="#102a43" stroke="none" stroke-width="2"/><text x="220" y="216" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle">You</text><circle cx="94" cy="279" r="5" fill="#102a43"/><text x="110" y="286" font-size="20" fill="#102a43" font-weight="400" text-anchor="start">Share your loans, income</text><text x="110" y="312" font-size="20" fill="#102a43" font-weight="400" text-anchor="start">and documents</text><circle cx="94" cy="353" r="5" fill="#102a43"/><text x="110" y="360" font-size="20" fill="#102a43" font-weight="400" text-anchor="start">Decide whether to</text><text x="110" y="386" font-size="20" fill="#102a43" font-weight="400" text-anchor="start">go ahead</text><circle cx="94" cy="427" r="5" fill="#102a43"/><text x="110" y="434" font-size="20" fill="#102a43" font-weight="400" text-anchor="start">Pay the lender directly</text><line x1="386" y1="370" x2="434" y2="370" stroke="#52606d" stroke-width="3" marker-end="url(#ah)"/><rect x="440" y="170" width="320" height="400" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="440" y="170" width="320" height="70" rx="16" fill="#00875a" stroke="none" stroke-width="2"/><rect x="440" y="210" width="320" height="30" rx="0" fill="#00875a" stroke="none" stroke-width="2"/><text x="600" y="216" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle">Loan Free</text><circle cx="474" cy="279" r="5" fill="#00875a"/><text x="490" y="286" font-size="20" fill="#102a43" font-weight="400" text-anchor="start">Assess your options</text><circle cx="474" cy="327" r="5" fill="#00875a"/><text x="490" y="334" font-size="20" fill="#102a43" font-weight="400" text-anchor="start">Prepare a written request</text><circle cx="474" cy="375" r="5" fill="#00875a"/><text x="490" y="382" font-size="20" fill="#102a43" font-weight="400" text-anchor="start">Check offers and letters</text><circle cx="474" cy="423" r="5" fill="#00875a"/><text x="490" y="430" font-size="20" fill="#102a43" font-weight="400" text-anchor="start">Guide you on the NOC</text><text x="490" y="456" font-size="20" fill="#102a43" font-weight="400" text-anchor="start">and credit report</text><line x1="766" y1="370" x2="814" y2="370" stroke="#52606d" stroke-width="3" marker-end="url(#ah)"/><rect x="820" y="170" width="320" height="400" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="820" y="170" width="320" height="70" rx="16" fill="#c79a3a" stroke="none" stroke-width="2"/><rect x="820" y="210" width="320" height="30" rx="0" fill="#c79a3a" stroke="none" stroke-width="2"/><text x="980" y="216" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle">Your lender</text><circle cx="854" cy="279" r="5" fill="#c79a3a"/><text x="870" y="286" font-size="20" fill="#102a43" font-weight="400" text-anchor="start">Reviews your request</text><text x="870" y="312" font-size="20" fill="#102a43" font-weight="400" text-anchor="start">under its own policy</text><circle cx="854" cy="353" r="5" fill="#c79a3a"/><text x="870" y="360" font-size="20" fill="#102a43" font-weight="400" text-anchor="start">Accepts, counters</text><text x="870" y="386" font-size="20" fill="#102a43" font-weight="400" text-anchor="start">or declines</text><circle cx="854" cy="427" r="5" fill="#c79a3a"/><text x="870" y="434" font-size="20" fill="#102a43" font-weight="400" text-anchor="start">Issues the settlement</text><text x="870" y="460" font-size="20" fill="#102a43" font-weight="400" text-anchor="start">letter</text><rect x="60" y="600" width="1080" height="50" rx="12" fill="#fbf3e1" stroke="none" stroke-width="2"/><text x="600" y="632" font-size="19" fill="#102a43" font-weight="600" text-anchor="middle">Settlement amounts are always paid to your lender’s official account — never to Loan Free.</text>
</svg>
