<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Cheque bounce (Section 138) time limits</title><desc id="d">A timeline under the Negotiable Instruments Act, 1881: the cheque is returned unpaid; the payee has 30 days from learning of the dishonour to send a written demand notice; the drawer has 15 days from receiving the notice to pay; if unpaid, the payee may file a complaint within one month after those 15 days end.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52606d"/></marker></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="#f7f9fc" stroke="none" stroke-width="2"/>
<text x="60" y="78" font-size="34" fill="#102a43" font-weight="700" text-anchor="start">Section 138 cheque bounce: the key time limits</text><text x="60" y="116" font-size="20" fill="#52606d" font-weight="400" text-anchor="start">Negotiable Instruments Act, 1881 — sections 138 and 142.</text><line x1="140" y1="340" x2="1060" y2="340" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/><circle cx="140" cy="340" r="26" fill="#102a43"/><text x="140" y="260" font-size="22" fill="#102a43" font-weight="700" text-anchor="middle">Cheque returned</text><text x="140" y="400" font-size="18" fill="#52606d" font-weight="400" text-anchor="middle">Bank returns the</text><text x="140" y="424.3" font-size="18" fill="#52606d" font-weight="400" text-anchor="middle">cheque unpaid</text><circle cx="450" cy="340" r="26" fill="#00875a"/><text x="450" y="260" font-size="22" fill="#102a43" font-weight="700" text-anchor="middle">Demand notice</text><text x="450" y="400" font-size="18" fill="#52606d" font-weight="400" text-anchor="middle">Within 30 days of</text><text x="450" y="424.3" font-size="18" fill="#52606d" font-weight="400" text-anchor="middle">learning of the bounce</text><circle cx="760" cy="340" r="26" fill="#c79a3a"/><text x="760" y="260" font-size="22" fill="#102a43" font-weight="700" text-anchor="middle">Time to pay</text><text x="760" y="400" font-size="18" fill="#52606d" font-weight="400" text-anchor="middle">15 days from</text><text x="760" y="424.3" font-size="18" fill="#52606d" font-weight="400" text-anchor="middle">receiving the notice</text><circle cx="1060" cy="340" r="26" fill="#b42318"/><text x="1060" y="260" font-size="22" fill="#102a43" font-weight="700" text-anchor="middle">Complaint</text><text x="1060" y="400" font-size="18" fill="#52606d" font-weight="400" text-anchor="middle">Within 1 month after</text><text x="1060" y="424.3" font-size="18" fill="#52606d" font-weight="400" text-anchor="middle">the 15 days end</text><rect x="60" y="500" width="1080" height="110" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="540" font-size="20" fill="#102a43" font-weight="700" text-anchor="middle">Received a notice? Paying within the 15 days, or replying with your side, matters.</text><text x="600" y="574" font-size="18" fill="#52606d" font-weight="400" text-anchor="middle">Speak to an advocate quickly — court proceedings have their own rules. General information only.</text>
</svg>
