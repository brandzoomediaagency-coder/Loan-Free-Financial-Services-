<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Settlement or restructuring: a simple decision guide</title><desc id="d">A decision flow. Can you keep paying if the EMI is lower or the tenure longer? If yes, ask about restructuring, which usually harms your credit report less. If no, can you arrange a lump sum or short plan? If yes, a settlement may be possible but will be reported as Settled. If neither, get advice before missing more payments.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52606d"/></marker></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="#f7f9fc" stroke="none" stroke-width="2"/>
<text x="60" y="78" font-size="34" fill="#102a43" font-weight="700" text-anchor="start">Settlement or restructuring?</text><text x="60" y="116" font-size="20" fill="#52606d" font-weight="400" text-anchor="start">A starting point for the conversation — your lender decides what it will offer.</text><rect x="380" y="150" width="440" height="90" rx="14" fill="#102a43" stroke="none" stroke-width="2"/><text x="600" y="188" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">Could you keep paying with a</text><text x="600" y="215" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">lower EMI or longer tenure?</text><line x1="470" y1="244" x2="280" y2="320" stroke="#52606d" stroke-width="3" marker-end="url(#ah)"/><text x="345" y="280" font-size="18" fill="#00875a" font-weight="700" text-anchor="start">Yes</text><line x1="730" y1="244" x2="860" y2="320" stroke="#52606d" stroke-width="3" marker-end="url(#ah)"/><text x="808" y="280" font-size="18" fill="#b42318" font-weight="700" text-anchor="start">No</text><rect x="60" y="330" width="440" height="200" rx="14" fill="#e6f4ee" stroke="none" stroke-width="2"/><text x="90" y="375" font-size="20" fill="#102a43" font-weight="700" text-anchor="start">Ask about restructuring</text><text x="90" y="402" font-size="20" fill="#102a43" font-weight="400" text-anchor="start">Smaller EMIs or a longer tenure.</text><text x="90" y="429" font-size="20" fill="#102a43" font-weight="400" text-anchor="start">Usually less damage to your</text><text x="90" y="456" font-size="20" fill="#102a43" font-weight="400" text-anchor="start">credit report than a settlement.</text><rect x="640" y="330" width="500" height="90" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="890" y="368" font-size="20" fill="#102a43" font-weight="700" text-anchor="middle">Can you arrange a lump sum</text><text x="890" y="395" font-size="20" fill="#102a43" font-weight="700" text-anchor="middle">or a short payment plan?</text><line x1="780" y1="424" x2="740" y2="470" stroke="#52606d" stroke-width="3" marker-end="url(#ah)"/><line x1="1000" y1="424" x2="1040" y2="470" stroke="#52606d" stroke-width="3" marker-end="url(#ah)"/><rect x="560" y="480" width="330" height="140" rx="14" fill="#fbf3e1" stroke="none" stroke-width="2"/><text x="580" y="518" font-size="18" fill="#102a43" font-weight="700" text-anchor="start">Settlement may be possible</text><text x="580" y="542.3" font-size="18" fill="#102a43" font-weight="400" text-anchor="start">Reported as “Settled”; the</text><text x="580" y="566.6" font-size="18" fill="#102a43" font-weight="400" text-anchor="start">lender must agree.</text><rect x="910" y="480" width="230" height="140" rx="14" fill="#fdecea" stroke="none" stroke-width="2"/><text x="930" y="518" font-size="18" fill="#102a43" font-weight="700" text-anchor="start">Get advice now</text><text x="930" y="542.3" font-size="18" fill="#102a43" font-weight="400" text-anchor="start">before missing</text><text x="930" y="566.6" font-size="18" fill="#102a43" font-weight="400" text-anchor="start">more payments.</text>
</svg>
