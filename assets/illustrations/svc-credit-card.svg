<filter id="sh2" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0B2035" flood-opacity=".14"/></filter>
<linearGradient id="gNavy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F4566"/><stop offset="1" stop-color="#0B2035"/></linearGradient>
<linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F9A82"/><stop offset="1" stop-color="#127060"/></linearGradient>
<linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E7C77F"/><stop offset="1" stop-color="#C79A3A"/></linearGradient>
<linearGradient id="gDesk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EADCC4"/><stop offset="1" stop-color="#DCC7A6"/></linearGradient>
<linearGradient id="gScreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F7FA"/></linearGradient>
<radialGradient id="gGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#1F9A82" stop-opacity=".35"/><stop offset="1" stop-color="#1F9A82" stop-opacity="0"/></radialGradient>
</defs>
<rect x="0" y="0" width="480" height="360" rx="0" fill="transparent" /><circle cx="120" cy="90" r="100" fill="#E9F4F1" opacity="1"/><circle cx="380" cy="280" r="90" fill="#FBF5E7" opacity="1"/><g filter="url(#sh)" transform="rotate(-10 180 170)"><rect x="70" y="110" width="220" height="136" rx="16" fill="url(#gNavy)" /><rect x="96" y="150" width="40" height="30" rx="6" fill="#D6AE58" /><rect x="96" y="206" width="150" height="9" rx="4.5" fill="#1F4566" /></g><g filter="url(#sh)" transform="rotate(6 250 200)"><rect x="150" y="140" width="220" height="136" rx="16" fill="url(#gGreen)" /><rect x="176" y="180" width="40" height="30" rx="6" fill="#F4E6C3" /><rect x="176" y="236" width="150" height="9" rx="4.5" fill="#127060" /></g><g filter="url(#sh)"><rect x="300" y="40" width="150" height="110" rx="14" fill="#FFFFFF" /></g><g transform="translate(300 40)"><text x="14" y="26" font-size="13" font-weight="700" fill="#0B2035" text-anchor="start">Balance</text><path d="M16 48 L50 56 L84 66 L118 84" fill="none" stroke="#167B68" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="14" y="92" width="90" height="6" rx="3" fill="#D9E1EA" /></g>
