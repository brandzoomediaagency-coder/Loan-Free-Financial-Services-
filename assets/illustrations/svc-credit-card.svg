<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Credit card dues</title><desc id="d">Illustration: two payment cards beside a statement with a downward-trending balance chart.</desc><defs>
