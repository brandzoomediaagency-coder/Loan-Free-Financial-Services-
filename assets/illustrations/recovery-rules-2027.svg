<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Recovery agent rules from 1 January 2027</title><desc id="d">Key changes under the RBI recovery directions of 6 August 2026 for banks and NBFCs, effective 1 January 2027: contact only between 8 a.m. and 7 p.m.; agency details given at least one day before the first visit; agents carry ID, authorisation letter and a copy of that notice; recovery calls logged and recorded; agents discuss the loan only with the borrower or guarantor; compensation policy for non-compliant recovery.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52606d"/></marker></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="#f7f9fc" stroke="none" stroke-width="2"/>
<text x="60" y="78" font-size="34" fill="#102a43" font-weight="700" text-anchor="start">Recovery rules for banks and NBFCs from 1 January 2027</text><text x="60" y="116" font-size="20" fill="#52606d" font-weight="400" text-anchor="start">RBI directions dated 6 August 2026. Always check the official text for your lender type.</text><rect x="60" y="160" width="340" height="200" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="104" cy="208" r="22" fill="#e6f4ee"/><path d="M94 206 l6 6 l12 -14" fill="none" stroke="#00875a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="216" font-size="22" fill="#102a43" font-weight="700" text-anchor="start">Contact hours</text><text x="90" y="270" font-size="19" fill="#52606d" font-weight="400" text-anchor="start">8:00 a.m. to 7:00 p.m.</text><text x="90" y="295.65" font-size="19" fill="#52606d" font-weight="400" text-anchor="start">unless you ask otherwise</text><rect x="430" y="160" width="340" height="200" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="474" cy="208" r="22" fill="#e6f4ee"/><path d="M464 206 l6 6 l12 -14" fill="none" stroke="#00875a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="510" y="216" font-size="22" fill="#102a43" font-weight="700" text-anchor="start">Notice before visits</text><text x="460" y="270" font-size="19" fill="#52606d" font-weight="400" text-anchor="start">Agency details given at</text><text x="460" y="295.65" font-size="19" fill="#52606d" font-weight="400" text-anchor="start">least one day before the</text><text x="460" y="321.3" font-size="19" fill="#52606d" font-weight="400" text-anchor="start">first visit</text><rect x="800" y="160" width="340" height="200" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="844" cy="208" r="22" fill="#e6f4ee"/><path d="M834 206 l6 6 l12 -14" fill="none" stroke="#00875a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="880" y="216" font-size="22" fill="#102a43" font-weight="700" text-anchor="start">Agent must carry</text><text x="830" y="270" font-size="19" fill="#52606d" font-weight="400" text-anchor="start">Identity card, authorisation</text><text x="830" y="295.65" font-size="19" fill="#52606d" font-weight="400" text-anchor="start">letter and a copy of</text><text x="830" y="321.3" font-size="19" fill="#52606d" font-weight="400" text-anchor="start">the notice</text><rect x="60" y="385" width="340" height="200" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="104" cy="433" r="22" fill="#e6f4ee"/><path d="M94 431 l6 6 l12 -14" fill="none" stroke="#00875a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="441" font-size="22" fill="#102a43" font-weight="700" text-anchor="start">Calls on record</text><text x="90" y="495" font-size="19" fill="#52606d" font-weight="400" text-anchor="start">Recovery calls logged;</text><text x="90" y="520.65" font-size="19" fill="#52606d" font-weight="400" text-anchor="start">recordings kept by</text><text x="90" y="546.3" font-size="19" fill="#52606d" font-weight="400" text-anchor="start">the lender</text><rect x="430" y="385" width="340" height="200" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="474" cy="433" r="22" fill="#e6f4ee"/><path d="M464 431 l6 6 l12 -14" fill="none" stroke="#00875a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="510" y="441" font-size="22" fill="#102a43" font-weight="700" text-anchor="start">Who they may contact</text><text x="460" y="495" font-size="19" fill="#52606d" font-weight="400" text-anchor="start">Only you or your guarantor</text><text x="460" y="520.65" font-size="19" fill="#52606d" font-weight="400" text-anchor="start">about the loan — no</text><text x="460" y="546.3" font-size="19" fill="#52606d" font-weight="400" text-anchor="start">harassing family or friends</text><rect x="800" y="385" width="340" height="200" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="844" cy="433" r="22" fill="#e6f4ee"/><path d="M834 431 l6 6 l12 -14" fill="none" stroke="#00875a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="880" y="441" font-size="22" fill="#102a43" font-weight="700" text-anchor="start">Compensation policy</text><text x="830" y="495" font-size="19" fill="#52606d" font-weight="400" text-anchor="start">Lenders must have a policy</text><text x="830" y="520.65" font-size="19" fill="#52606d" font-weight="400" text-anchor="start">for losses from</text><text x="830" y="546.3" font-size="19" fill="#52606d" font-weight="400" text-anchor="start">non-compliant recovery</text><text x="600" y="640" font-size="17" fill="#52606d" font-weight="400" text-anchor="middle">Summary for general information only — not legal advice.</text>
</svg>
