<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Where to complain about recovery or loan app harassment</title><desc id="d">An escalation ladder: 1 record everything; 2 complain in writing to the lender’s grievance redressal officer; 3 if there is no reply within 30 days or you are not satisfied, complain to the RBI Ombudsman at cms.rbi.org.in; for threats, extortion or morphed images, go to the police or cybercrime.gov.in at any stage.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52606d"/></marker></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="#f7f9fc" stroke="none" stroke-width="2"/>
<text x="60" y="78" font-size="34" fill="#102a43" font-weight="700" text-anchor="start">How to escalate a recovery complaint</text><text x="60" y="116" font-size="20" fill="#52606d" font-weight="400" text-anchor="start">Start with the lender. Go to the police at any stage if you are threatened.</text><rect x="60" y="470" width="520" height="112" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="110" cy="526" r="30" fill="#00875a"/><text x="110" y="536" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="160" y="514" font-size="23" fill="#102a43" font-weight="700" text-anchor="start">Record everything</text><text x="160" y="548" font-size="17" fill="#52606d" font-weight="400" text-anchor="start">Dates, times, numbers, screenshots,</text><text x="160" y="570.1" font-size="17" fill="#52606d" font-weight="400" text-anchor="start">call recordings and names</text><rect x="200" y="340" width="520" height="112" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="250" cy="396" r="30" fill="#00875a"/><text x="250" y="406" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="300" y="384" font-size="23" fill="#102a43" font-weight="700" text-anchor="start">Write to the lender</text><text x="300" y="418" font-size="17" fill="#52606d" font-weight="400" text-anchor="start">Grievance redressal officer of the</text><text x="300" y="440.1" font-size="17" fill="#52606d" font-weight="400" text-anchor="start">bank or NBFC (details on its website)</text><rect x="340" y="210" width="520" height="112" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="390" cy="266" r="30" fill="#00875a"/><text x="390" y="276" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="440" y="254" font-size="23" fill="#102a43" font-weight="700" text-anchor="start">RBI Ombudsman</text><text x="440" y="288" font-size="17" fill="#52606d" font-weight="400" text-anchor="start">No reply in 30 days or not satisfied:</text><text x="440" y="310.1" font-size="17" fill="#52606d" font-weight="400" text-anchor="start">complain at cms.rbi.org.in</text><rect x="890" y="150" width="250" height="432" rx="16" fill="#fdecea" stroke="#f5c2bd" stroke-width="2"/><text x="1015" y="198" font-size="22" fill="#b42318" font-weight="700" text-anchor="middle">Any stage</text><text x="1015" y="250" font-size="19" fill="#102a43" font-weight="400" text-anchor="middle">Threats, abuse,</text><text x="1015" y="277.55" font-size="19" fill="#102a43" font-weight="400" text-anchor="middle">extortion or</text><text x="1015" y="305.1" font-size="19" fill="#102a43" font-weight="400" text-anchor="middle">morphed photos?</text><text x="1015" y="332.65" font-size="19" fill="#102a43" font-weight="400" text-anchor="middle"></text><text x="1015" y="360.2" font-size="19" fill="#102a43" font-weight="400" text-anchor="middle">Police station or</text><text x="1015" y="387.75" font-size="19" fill="#102a43" font-weight="400" text-anchor="middle">cybercrime.gov.in</text><text x="1015" y="415.29999999999995" font-size="19" fill="#102a43" font-weight="400" text-anchor="middle">(helpline 1930)</text><text x="600" y="640" font-size="17" fill="#52606d" font-weight="400" text-anchor="middle">Keep copies of every complaint and reply. General information, not legal advice.</text>
</svg>
