<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">The credit card minimum-due cycle</title><desc id="d">A loop: you pay only the minimum due; interest is charged on the unpaid balance; fees and new spending add to it; the next bill is about as high as before, so the cycle repeats.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52606d"/></marker></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="#f7f9fc" stroke="none" stroke-width="2"/>
<text x="60" y="78" font-size="34" fill="#102a43" font-weight="700" text-anchor="start">Why paying only the minimum due keeps you in debt</text><text x="60" y="116" font-size="20" fill="#52606d" font-weight="400" text-anchor="start">Interest is charged on the balance you carry forward, so the total falls very slowly.</text><circle cx="600" cy="390" r="170" fill="none" stroke="#cbd5e1" stroke-width="6" stroke-dasharray="14 12"/><rect x="480" y="176" width="240" height="88" rx="16" fill="#102a43" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="214" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">You pay the</text><text x="600" y="242" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">minimum due</text><rect x="650" y="346" width="240" height="88" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="770" y="384" font-size="20" fill="#102a43" font-weight="700" text-anchor="middle">Interest on the</text><text x="770" y="412" font-size="20" fill="#102a43" font-weight="700" text-anchor="middle">unpaid balance</text><rect x="480" y="516" width="240" height="88" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="554" font-size="20" fill="#102a43" font-weight="700" text-anchor="middle">Fees and new</text><text x="600" y="582" font-size="20" fill="#102a43" font-weight="700" text-anchor="middle">spending added</text><rect x="310" y="346" width="240" height="88" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="430" y="384" font-size="20" fill="#102a43" font-weight="700" text-anchor="middle">Next bill: almost</text><text x="430" y="412" font-size="20" fill="#102a43" font-weight="700" text-anchor="middle">the same balance</text><rect x="60" y="250" width="230" height="210" rx="14" fill="#e6f4ee" stroke="none" stroke-width="2"/><text x="80" y="290" font-size="18" fill="#102a43" font-weight="700" text-anchor="start">Ways out</text><text x="80" y="315.56" font-size="18" fill="#102a43" font-weight="400" text-anchor="start">• Pay more than</text><text x="80" y="341.12" font-size="18" fill="#102a43" font-weight="400" text-anchor="start">   the minimum</text><text x="80" y="366.68" font-size="18" fill="#102a43" font-weight="400" text-anchor="start">• EMI conversion</text><text x="80" y="392.24" font-size="18" fill="#102a43" font-weight="400" text-anchor="start">• Repayment plan</text><text x="80" y="417.8" font-size="18" fill="#102a43" font-weight="400" text-anchor="start">   or settlement</text><rect x="910" y="250" width="230" height="210" rx="14" fill="#fbf3e1" stroke="none" stroke-width="2"/><text x="930" y="290" font-size="18" fill="#102a43" font-weight="700" text-anchor="start">Read your</text><text x="930" y="315.56" font-size="18" fill="#102a43" font-weight="400" text-anchor="start">statement</text><text x="930" y="341.12" font-size="18" fill="#102a43" font-weight="400" text-anchor="start">It shows the</text><text x="930" y="366.68" font-size="18" fill="#102a43" font-weight="400" text-anchor="start">interest rate and</text><text x="930" y="392.24" font-size="18" fill="#102a43" font-weight="400" text-anchor="start">the total amount</text><text x="930" y="417.8" font-size="18" fill="#102a43" font-weight="400" text-anchor="start">you owe</text>
</svg>
